<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: ganigo-friso.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One:wght@400&family=Nunito:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#8b421e}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-clay-ground region texture" data-region="clay-ground" style="background-image:url('../../../assets/plates/clay-ground.png');background-repeat:repeat"></div>
  <figure class="r-frieze-top region plate" data-region="frieze-top"><img src="../../../assets/plates/frieze-top.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-gd-seal region plate" data-region="gd-seal"><img src="../../../assets/plates/gd-seal.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-nav-links region control" data-region="nav-links"><!-- navigation links in cream Nunito: Proyectos · ES · EN · DE · FR separated by dots: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-links); a control need not have button chrome --></div>
  <div class="r-title region text" data-region="title"><!-- GOFIO DESIGN in thin cream Poiret One capitals, the page headline --><p style="font-size:var(--r-title-font);font-family:var(--r-title-family),sans-serif;font-weight:var(--r-title-weight);line-height:1.05;margin:0">title</p></div>
  <div class="r-hook region text" data-region="hook"><!-- three-line cream Nunito hook: Estudio en Tenerife desde 2005. Webs, redes, jardines y patrimonio, hechos para durar. --><p style="font-size:var(--r-hook-font);font-family:var(--r-hook-family),sans-serif;font-weight:var(--r-hook-weight);line-height:1.05;margin:0">hook</p></div>
  <figure class="r-whatsapp-seal-plate region plate" data-region="whatsapp-seal-plate"><img src="../../../assets/plates/whatsapp-seal-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-whatsapp-seal region control" data-region="whatsapp-seal"><!-- label of the primary action on the amber seal: WhatsApp glyph and cream Nunito text Escríbenos por WhatsApp: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop whatsapp-seal); a control need not have button chrome --></div>
  <figure class="r-scene-island region plate" data-region="scene-island"><img src="../../../assets/plates/scene-island.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-frieze-mid-top region plate" data-region="frieze-mid-top"><img src="../../../assets/plates/frieze-mid-top.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-medallion-identidad region plate" data-region="medallion-identidad"><img src="../../../assets/plates/medallion-identidad.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-label-identidad region text" data-region="label-identidad"><!-- two-line cream Nunito label: Identidad e infraestructura digital --><p style="font-size:var(--r-label-identidad-font);line-height:1.05;margin:0">label-identidad</p></div>
  <figure class="r-divider-1 region plate" data-region="divider-1"><img src="../../../assets/plates/divider-1.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-medallion-paisaje region plate" data-region="medallion-paisaje"><img src="../../../assets/plates/medallion-paisaje.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-label-paisaje region text" data-region="label-paisaje"><!-- two-line cream Nunito label: Paisaje y territorio canario --><p style="font-size:var(--r-label-paisaje-font);line-height:1.05;margin:0">label-paisaje</p></div>
  <figure class="r-divider-2 region plate" data-region="divider-2"><img src="../../../assets/plates/divider-2.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-medallion-gestion region plate" data-region="medallion-gestion"><img src="../../../assets/plates/medallion-gestion.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-label-gestion region text" data-region="label-gestion"><!-- two-line cream Nunito label: Gestión de activos y dinamización --><p style="font-size:var(--r-label-gestion-font);line-height:1.05;margin:0">label-gestion</p></div>
  <figure class="r-frieze-mid-bottom region plate" data-region="frieze-mid-bottom"><img src="../../../assets/plates/frieze-mid-bottom.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-heading-proyectos region text" data-region="heading-proyectos"><!-- section heading Proyectos reales in thin cream Poiret One --><p style="font-size:var(--r-heading-proyectos-font);font-family:var(--r-heading-proyectos-family),sans-serif;font-weight:var(--r-heading-proyectos-weight);line-height:1.05;margin:0">heading-proyectos</p></div>
  <figure class="r-ornament-proyectos region plate" data-region="ornament-proyectos"><img src="../../../assets/plates/ornament-proyectos.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-tile-terapia region chrome" data-region="tile-terapia"><!-- raised clay tile with rounded corners and soft inset edge holding a project screenshot and its caption --></div>
  <figure class="r-shot-terapia region plate" data-region="shot-terapia"><img src="../../../assets/plates/shot-terapia.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-caption-terapia region text" data-region="caption-terapia"><!-- cream Nunito caption: Mi Terapia Regresiva (the comp reads Clínica Dental Dharma; the user chose Mi Terapia Regresiva) --><p style="line-height:1.05;margin:0">caption-terapia</p></div>
  <div class="r-tile-archipielago region chrome" data-region="tile-archipielago"><!-- raised clay tile with rounded corners and soft inset edge holding a project screenshot and its caption --></div>
  <figure class="r-shot-archipielago region plate" data-region="shot-archipielago"><img src="../../../assets/plates/shot-archipielago.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-caption-archipielago region text" data-region="caption-archipielago"><!-- cream Nunito caption: Archipiélago Vivo --><p style="font-size:var(--r-caption-archipielago-font);line-height:1.05;margin:0">caption-archipielago</p></div>
  <div class="r-tile-diezclaves region chrome" data-region="tile-diezclaves"><!-- raised clay tile with rounded corners and soft inset edge holding a project screenshot and its caption --></div>
  <figure class="r-shot-diezclaves region plate" data-region="shot-diezclaves"><img src="../../../assets/plates/shot-diezclaves.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-caption-diezclaves region text" data-region="caption-diezclaves"><!-- cream Nunito caption: Diez Claves --><p style="font-size:var(--r-caption-diezclaves-font);line-height:1.05;margin:0">caption-diezclaves</p></div>
</main>
</body>
</html>
